name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # LLM and embedding calls must be mocked in tests; CI never needs an OpenRouter key.
      - run: pytest --cov=. --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      # Keep in step with the dev extra in pyproject.toml by hand: Dependabot does not update
      # versions in `run:` lines.
      - run: pip install pip-audit==2.10.1
      # Accepted risk, documented in docs/SECURITY.md: these four chromadb advisories (no fixed
      # version yet) affect only the Chroma HTTP server (its /api/v2 endpoints and multi-tenant
      # authorization). The app uses Chroma embedded in-process (PersistentClient), never as a
      # server, and never uses Chroma's embedding functions. Remove each line once a fixed
      # chromadb release is pinned.
      #   PYSEC-2026-311  = CVE-2026-45829 (unauthenticated code injection via the server API)
      #   PYSEC-2026-3814 = CVE-2026-45833 (authenticated code injection via the server API)
      #   PYSEC-2026-3815 = CVE-2026-45831 (server RBAC ignores tenant/database/collection scope)
      #   PYSEC-2026-3813 = CVE-2026-45830 (server lacks cross-tenant authorization checks)
      # Accepted risk (T1.6), documented in docs/SECURITY.md: eight pillow 12.3.0 advisories, fixed
      # in pillow 13.0.0, which streamlit (every release up to the pinned 1.66.0) does not allow
      # yet (it requires pillow<13). All are in pillow's image decoders (TIFF, GIF, JPEG, EPS, PDF
      # parsing), reached only by opening a crafted image; the app decodes no images. Remove these
      # lines once a streamlit release allows pillow 13 and pillow >= 13.0.0 is installed.
      #   CVE-2026-112395 (tiled-TIFF decoder reads past the tile buffer)
      #   CVE-2026-112397 (out-of-bounds access in morphology on a zero-width image)
      #   CVE-2026-112400 (GIF seek after a DecompressionBombError, DoS)
      #   CVE-2026-112404 (TIFF tile and RGBA paths read out of bounds)
      #   CVE-2026-112895 (unbounded recursion parsing a PDF page tree)
      #   CVE-2026-112896 (TIFF encoder ColorMap out-of-bounds read)
      #   CVE-2026-112897 (TIFF decoder returns uninitialised memory for short JPEG strips)
      #   CVE-2026-112899 (EPS load(scale) renders past the decompression bomb limit)
      - run: >-
          pip-audit .
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln CVE-2026-112395
          --ignore-vuln CVE-2026-112397
          --ignore-vuln CVE-2026-112400
          --ignore-vuln CVE-2026-112404
          --ignore-vuln CVE-2026-112895
          --ignore-vuln CVE-2026-112896
          --ignore-vuln CVE-2026-112897
          --ignore-vuln CVE-2026-112899
